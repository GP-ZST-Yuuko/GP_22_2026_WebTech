<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter</title>
</head>
<body>

    <script>
        const numbers = [4, 11, 18, 7, 25, 10];

        const liczbyWiekszeOd10 = numbers.filter(
            (number) => number > 10
        )

        const liczbyMniejszeRowne10 = numbers.filter(
            (number) => number <= 10
        )

        const liczbyParzyste = numbers.filter(
            (number) => number % 2 == 0
        )



        const products = [
        { id: 1, name: "Laptop", category: "Komputery", price: 3500 },
        { id: 2, name: "Mysz", category: "Akcesoria", price: 80 },
        { id: 3, name: "Klawiatura", category: "Akcesoria", price: 200 },
        { id: 4, name: "Monitor", category: "Monitory", price: 900 }
        ];

        const accessories1 = products.filter(
        (product) => product.category === "Komputery"
        );

        // const accessories2 = products.filter(
        // (product) => product.category === "Telefony"
        // );

        const cheapProducts = products.filter((product) => product.price <= 200);



        console.log(liczbyWiekszeOd10)
        console.log(liczbyMniejszeRowne10)
        console.log(liczbyParzyste)

        console.log(accessories1)
        console.log(cheapProducts)


    </script>
    
</body>
</html>
